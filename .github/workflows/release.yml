name: Publish Android APK

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      run_id:
        required: true
        type: string
      tag:
        required: true
        type: string
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.5.84-v6'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'karl1179090/huayoupu-ledger'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      REQUESTED_COMMIT: ${{ inputs.commit || '' }}
      BUILD_RUN_ID: ${{ inputs.run_id || '' }}
      EXPECTED_CERT_SHA256: 62101969d492aa5538794aa6e4f8f1e99ac37a3de42f384468c9b8e2a9b0c014
    steps:
      - name: Validate version tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.0
      # Check the four build gates, never the publishing job of this same run.
      - name: Require successful checks for the exact main commit
        run: |
          set -euo pipefail
          commit="$REQUESTED_COMMIT"
          if [ -z "$commit" ]; then commit=$(git rev-parse "$RELEASE_TAG^{commit}"); fi
          run_id="$BUILD_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android.yml --commit "$commit" --branch main --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          test -n "$run_id" || { echo 'No automatic main build exists for this commit.'; exit 1; }
          python scripts/ledger-release.py wait-for-checks --run-id "$run_id" --commit "$commit"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name android-arm64 --dir release
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name checked-source --dir release
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Verify APK signature, checksums and provenance
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum --check ./*.sha256
          python - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          metadata = json.loads(pathlib.Path('build-info.json').read_text())
          import runpy
          runpy.run_path('../scripts/ledger-release.py')['validate_metadata'](
              metadata, os.environ['RELEASE_COMMIT'], os.environ['RELEASE_TAG'])
          apk, = pathlib.Path('.').glob('*.apk')
          assert apk.name == metadata['filename'] and not apk.name.endswith('-unsigned.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == metadata['sha256']
          with zipfile.ZipFile(apk) as archive:
              abis = {name.split('/')[1] for name in archive.namelist() if name.startswith('lib/') and name.endswith('.so')}
          assert abis == {'arm64-v8a'}, f'Unexpected native libraries: {abis}'
          PY
          apk=(./*.apk)
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "${apk[0]}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "${apk[0]}" | tee verified-signature.txt
          grep -Fx "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" verified-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "${apk[0]}" > apk-badging.txt
          if grep -q 'application-debuggable' apk-badging.txt; then echo 'Refusing to publish a debuggable APK'; exit 1; fi
          python - <<'PY'
          import json, pathlib, re
          metadata = json.loads(pathlib.Path('build-info.json').read_text())
          badging = pathlib.Path('apk-badging.txt').read_text()
          assert re.search(r"versionCode='(\d+)'", badging).group(1) == str(metadata['versionCode'])
          assert re.search(r"versionName='([^']+)'", badging).group(1) == metadata['version']
          PY
      - name: Publish downloadable APK and matching source
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          花有谱 ${RELEASE_TAG#v}

          下载下方 **Huayoupu-Ledger-*-arm64-v8a.apk**，在 Android 11 或更高版本的 ARM64 手机上安装。

          - APK 由 GitHub Actions 构建，并使用项目固定签名。
          - 对应提交：$RELEASE_COMMIT；源码审计、浏览器回归、单元测试、Lint 和 ARM64 构建均已通过。
          - Android 模拟器回归通过独立工作流手动运行，不作为自动发布门槛。
          - 同时提供 APK SHA-256 校验值、构建信息和对应的完整公开源码 ZIP。
          - 从本地调试版切换时，若提示签名不一致，请先在应用内导出备份，再卸载旧版、安装并恢复备份。
          EOF
          python scripts/ledger-release.py publish --directory release --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG" --notes "$RUNNER_TEMP/release-notes.md"
